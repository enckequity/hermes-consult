name: hermes-consult
version: 0.2.3
description: Website question answering and contact requests from the business's published facts, with contact requests filed on the kanban board.
author: Dante Labs
requires_hermes: '>=0.22.5'
python_dependencies:
  - websocket-client>=1.8,<2
provides_tools: []
provides_hooks: []
provides_middleware: []
config_schema:
  openai_api_key:
    type: secret
    env: HERMES_CONSULT_OPENAI_API_KEY
    description: Optional. The business's own OpenAI key for voice. Voice also needs voice_enabled and is off by default.
  turnstile_secret:
    type: secret
    env: HERMES_CONSULT_TURNSTILE_SECRET
    description: Optional bot-check secret, required when a site sets a bot-check site key. Takes effect when the service restarts.
